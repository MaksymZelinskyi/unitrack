<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Uni-Track</title>
    <th:block th:insert="fragments :: head"></th:block>
    <script th:src="@{/js/live-search-panel.js}"></script>
    <script th:src="@{/js/search-pages/collaborator-search.js}"></script>
</head>
<body>

<div th:insert="fragments :: header"></div>

<div class="layout">

    <!-- MAIN SECTION -->
    <section class="main">
        <div class="header-row right">
            <h1 class="section-title centered" th:text="${workspace.name}">My team</h1>
        </div>

        <div class="project-grid-wrapper">

            <ul class="collaborator-list four-columns">

                <li th:if="${collaborators == null || #lists.isEmpty(collaborators)}">No members yet</li>
                <li th:each="collaborator : ${collaborators}">
                    <div class="collaborator-card">
                        <a th:href="@{/collaborators/{id}(id=${collaborator.id})}" class="collaborator-link">
                            <div class="collaborator-content">
                                <div class="project-header">
                                    <div class="avatar-wrapper">
                                        <img th:src="${#strings.isEmpty(collaborator.avatarUrl) ? '/icons/profile-icon.png' : collaborator.avatarUrl}"
                                             class="profile-avatar" alt="Profile Picture"/>
                                    </div>
                                    <h4 class="project-title" th:text="${collaborator.fullName}">Name</h4>
                                </div>
                            </div>
                        </a>
                        <form th:action="@{/workspaces/{workspaceId}/collaborators/{collaboratorId}(workspaceId=${workspace.id}, collaboratorId=${collaborator.id})}" method="post" class="collab-delete-form">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="collab-delete-button"
                                    th:data-name="${collaborator.fullName}"
                                    onclick="return confirmDelete(this)">
                                <img src="/icons/trash.png" alt="Delete" class="collab-delete-icon"/>
                            </button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </section>


    <!-- Right: Sidebar -->
    <aside class="right-sidebar workspace-search-sidebar">
        <label class="sidebar-title">Collaborator search</label>

        <div class="search-field-wrapper">
            <input
                    type="text"
                    id="collaboratorQuery"
                    name="collaborator"
                    class="live-search-input"
                    data-endpoint="/search/collaborator"
                    th:data-params="|workspaceId=${workspace.id}|"
                    data-results="collaboratorResultsPanel"
                    data-min-length="1"
                    data-debounce="300"
                    autocomplete="off"
            />
            <ul id="collaboratorResultsPanel" class="suggestions-dropdown">
                <p class="empty-text">Start typing to search collaborators…</p>
            </ul>

            <!-- holds the selected collaborator's id for form submission -->
            <input type="hidden" id="collaboratorId" name="collaboratorId" />
        </div>

    </aside>

</div>

<script>
    function confirmDelete(btn) {
        const name = btn.getAttribute('data-name');
        return confirm('Remove ' + name + ' as a collaborator?');
    }
</script>
<script th:inline="javascript">
    const workspace = [[${workspace}]]
</script>
<div th:insert="fragments :: confirm-modal"></div>
<script src="/js/confirmation.js"></script>
</body>
</html>
