<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Uni-Track</title>
    <th:block th:insert="fragments :: head"></th:block>
    <script th:src="@{/js/autocomplete.js}"></script>
    <script th:src="@{/js/pages/collaborator-search.js}"></script>
</head>
<body>

<div th:insert="fragments :: header"></div>

<div class="layout">

    <!-- MAIN SECTION -->
    <section class="main">
        <div class="header-row right">
            <a class="stats-btn" th:href="@{/statistics}">
                View Stats
            </a>

            <h1 class="section-title centered" th:text="${workspace.name}">My workspace</h1>
        </div>

        <div class="project-grid-wrapper">

            <ul class="project-list four-columns">
                <!-- Left: Add Project button -->
                <a title="New project" class="card add-project" th:href="@{/projects/new?workspaceId={workspaceId}(workspaceId=${workspace.id})}">
                    <img src="/icons/plus.png" alt="Add Project"/>
                    <p>Add New Project</p>
                </a>
                <li th:each="project : ${projects}">
                    <a title="Open project" th:href="@{/projects/{id}(id=${project.id})}" class="project-card">
                        <div class="project-status"
                             th:classappend="|${project.status.toLowerCase()}|"></div>

                        <div class="project-content">
                            <div class="project-header">
                                <h4 class="project-title" th:text="${project.title}">Project Name</h4>
                                <span class="project-status-label" th:text="${project.status}">ACTIVE</span>
                            </div>

                            <p class="project-desc" th:text="${project.description}">Project description</p>

                            <div class="bottom">
                                <div class="project-meta">
                                    <span class="meta-label">Start time:</span>
                                    <span class="meta-value" th:text="${#temporals.format(project.start, 'dd MMM yyyy')}"></span>
                                </div>

                                <div class="project-meta">
                                    <span class="meta-label">Deadline:</span>
                                    <span class="meta-value" th:text="${#temporals.format(project.end, 'dd MMM yyyy')}"></span>
                                </div>

                                <div class="project-meta">
                                    <span class="meta-label">Client:</span>
                                    <span class="meta-value" th:text="${project.client.name}">Client</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </section>


    <!-- Right: Sidebar -->
    <aside class="right-sidebar workspace-search-sidebar">  
        <label class="sidebar-title">Collaborator search</label>

        <div class="search-field-wrapper">
            <input
                    type="text"
                    id="collaboratorQuery"
                    name="collaborator"
                    class="autocomplete-input"
                    data-endpoint="/search/collaborator"
                    data-suggestions="collaboratorSuggestions"
                    data-min-length="1"
                    data-debounce="300"
                    autocomplete="off"
            />
            <ul id="collaboratorSuggestions" class="suggestions-dropdown">
                <p class="empty-text">Start typing to search collaborators…</p>
            </ul>

            <!-- holds the selected collaborator's id for form submission -->
            <input type="hidden" id="collaboratorId" name="collaboratorId" />
        </div>

    </aside>

</div>

<div class="project-actions">

    <form method="post" th:action="@{/workspaces/{id}(id=${workspace.id})}">
        <input name="_method" type="hidden" value="delete">

        <button class="btn btn-danger confirm-delete" type="submit">
            <img alt="Delete"
                 class="icon"
                 src="/icons/trash.png"/>
            <span>Delete Workspace</span>
        </button>
    </form>

    <form method="get" th:action="@{/workspaces/update/{id}(id=${workspace.id})}">
        <button class="btn btn-primary" type="submit">
            <img alt="Modify"
                 class="icon"
                 src="/icons/pencil.png"/>
            <span>Modify</span>
        </button>
    </form>
</div>

<div th:insert="fragments :: confirm-modal"></div>
<script src="/js/confirmation.js"></script>
</body>
</html>
